<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <title>My Daily Task Organizer</title>
</head>
<body>
  <div class="container py-4">

  <h1 class="mb-1">My Daily Task Organizer</h1>
  <p class="text-muted mb-4">Sort and label your daily tasks using JavaScript array methods!</p>

  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title"><b>Daily Tasks</b></h3>

      <button class="btn btn-success mr-2" onclick="sortAZ()"><b>Sort A to Z</b></button>
      <button class="btn btn-success" onclick="sortZA()"><b>Sort Z to A</b></button>

      <div id="taskResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

 <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title"><b>Task Time Needed</b></h3>

      <button class="btn btn-success mr-2" onclick="sortShortest()"><b>Shortest First</b></button>
      <button class="btn btn-success" onclick="sortLongest()"><b>Longest First</b></button>
      <div id="timeResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title"><b>Label Every Task Time</b></h3>

      <button class="btn btn-success" onclick="addLabel()"><b>Add Minutes Label</b></button>

      <div id="labelResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>
</div>

<script>
  var tasks = ["Homework", "Breakfast", "Exercise", "Reading", "Packing Bag"];
  var minutes = [30, 15, 20, 25, 10];

  document.getElementById("taskResult").innerHTML =
    "Tasks: " + tasks;

  document.getElementById("timeResult").innerHTML =
    "Minutes needed: " + minutes;

  document.getElementById("labelResult").innerHTML =
    "Press the button above!";

  function sortAZ() {
    var sortedTasks = tasks.slice().sort();
    document.getElementById("taskResult").innerHTML = "A to Z: " + sortedTasks;
  }

  function sortZA() {
    tasks.sort();
    tasks.reverse();
    document.getElementById("taskResult").innerHTML = "Z to A: " + tasks;
  }

  function sortShortest() {
    var sortedMinutes = minutes.slice().sort(function(a, b) { return a - b; });
    document.getElementById("timeResult").innerHTML = "Shortest First: " + sortedMinutes;
  }

  function sortLongest() {
    var sortedMinutes = minutes.slice().sort(function(a, b) { return b - a; });
    document.getElementById("timeResult").innerHTML = "Longest First: " + sortedMinutes;
  }

  function addLabel() {
    var labeledMinutes = minutes.map(function(min) { return min + " minutes"; });
    document.getElementById("labelResult").innerHTML = "Labeled Minutes: " + labeledMinutes;
  }
</script>
</body>
