<!DOCTYPE html>
<html>
<head>
  <title>Mitul's Birthday Countdown</title>
  <link rel="stylesheet" type="text/css" href="Style.css">
</head>
<body>

  <div class="birthday-card">

    <div class="birthday">Birthday Countdown</div>

    <h1>Mitul's Birthday Countdown</h1>

    <p>Click the button to see how long until my next birthday!</p>

    <button onclick="checkBirthday()">Check Countdown</button>

    <div class="info">
      <h2>Time Until My Birthday</h2>
      <p id="countdown">Click the button to start!</p>
    </div>

    <div class="info">
      <h2>Birthday Information</h2>
      <p id="result"></p>
    </div>

  </div>


  <script>

    function checkBirthday() {

      // My birthday
      const studentName = "Mitul";
      const birthdayMonth = 9;
      const birthdayDate = 25;

      // Null and Undefined
      let birthdayGift = null;
      let birthdayPlan;

      // Get today's date
      let today = new Date();
      let currentYear = today.getFullYear();

      // Create my birthday for this year
      let birthday = new Date(
        currentYear,
        birthdayMonth - 1,
        birthdayDate
      );

      // If my birthday already happened, use next year
      if (birthday < today) {
        birthday = new Date(
          currentYear + 1,
          birthdayMonth - 1,
          birthdayDate
        );
      }

      // Work out the time difference
      let difference = birthday - today;

      let days = Math.floor(difference / (1000 * 60 * 60 * 24));
      let hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );
      let minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );
      let seconds = Math.floor(
        (difference / 1000) % 60
      );

      let message = "";

      // If statement
      if (days === 0 && hours === 0 && minutes === 0) {
        message = "Happy Birthday, " + studentName + "!";
      } else if (days <= 7) {
        message = "My birthday is almost here!";
      } else {
        message = "Keep counting! My birthday is coming.";
      }

      // Show countdown
      document.getElementById("countdown").innerHTML =
        days + " days<br>" +
        hours + " hours<br>" +
        minutes + " minutes<br>" +
        seconds + " seconds";

      // Show information
      document.getElementById("result").innerHTML =
        "Name: " + studentName + "<br>" +
        "Birthday: 25 September<br>" +
        "Message: " + message + "<br><br>" +
        "Birthday Gift: " + birthdayGift + "<br>" +
        "Birthday Plan: " + birthdayPlan;

    }

  </script>

</body>
</html>
