<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Digital Zoo Manager</title>
</head>
<body>

  <h1>My Digital Zoo Manager</h1>

  <p>
    Use JavaScript and the DOM to explore animals, zones, parent nodes,
    child nodes, and sibling nodes.
  </p>

  <div id="zoo">

    <div class="zone" id="koalaZone">
      <h2>Koala Zone</h2>
      <p>Animal: <span class="animal">Koala</span></p>
    </div>

    <div class="zone" id="kangarooZone">
      <h2>Kangaroo Zone</h2>
      <p>Animal: <span class="animal">Kangaroo</span></p>
    </div>

    <div class="zone" id="emuZone">
      <h2>Emu Zone</h2>
      <p>Animal: <span class="animal">Emu</span></p>
    </div>

  </div>

  <button onclick="manageZoo()">Manage Zoo</button>

  <div id="output">
    Zoo information will appear here.
  </div>

  <script>
    function manageZoo() {

      // HTML DOM: Selecting elements from the webpage
      let zoo = document.getElementById("zoo");
      let koalaZone = document.getElementById("koalaZone");
      let kangarooZone = document.getElementById("kangarooZone");
      let emuZone = document.getElementById("emuZone");
      let output = document.getElementById("output");

      // The DOM Tree: zoo is the parent container of all animal zones
      let parentNodeName = koalaZone.parentNode.id;

      // Parent, Child, and Sibling Nodes
      let firstChildZone = zoo.children[0].id;
      let secondChildZone = zoo.children[1].id;
      let nextSiblingZone = kangarooZone.nextElementSibling.id;
      let previousSiblingZone = emuZone.previousElementSibling.id;

      // Types of Nodes
      let elementNodeType = koalaZone.nodeType;
      let textNodeType = koalaZone.firstChild.nodeType;

      // JavaScript and the DOM: Changing content and style
      koalaZone.style.backgroundColor = "#fff3cd";
      kangarooZone.style.backgroundColor = "#d1ecf1";
      emuZone.style.backgroundColor = "#f8d7da";

      koalaZone.querySelector("h2").innerHTML = "Updated Koala Zone";
      kangarooZone.querySelector("h2").innerHTML = "Updated Kangaroo Zone";
      emuZone.querySelector("h2").innerHTML = "Updated Emu Zone";

      output.innerHTML =
        "<strong>DOM Tree Information:</strong><br>" +
        "Parent of Koala Zone: " + parentNodeName + "<br>" +
        "First child of Zoo: " + firstChildZone + "<br>" +
        "Second child of Zoo: " + secondChildZone + "<br><br>" +

        "<strong>Sibling Node Information:</strong><br>" +
        "Next sibling of Kangaroo Zone: " + nextSiblingZone + "<br>" +
        "Previous sibling of Emu Zone: " + previousSiblingZone + "<br><br>" +

        "<strong>Types of Nodes:</strong><br>" +
        "Koala Zone element node type: " + elementNodeType + "<br>" +
        "Koala Zone first child text node type: " + textNodeType + "<br><br>" +

        "<strong>DOM Update:</strong><br>" +
        "The animal zone headings and background colours were updated using JavaScript.";
    }
  </script>

</body>
</html>
