<!DOCTYPE html>
<html>
<head>
  <title>Multiplication Function</title>
  <link rel="stylesheet" type="text/css" href="Style.css">
</head>
<body>

  <div class="container">

    <h1>Multiplication Function</h1>

    <p>Enter two numbers to multiply them.</p>

    <input type="number" id="number1" placeholder="First number">

    <br>

    <input type="number" id="number2" placeholder="Second number">

    <br><br>

    <button onclick="Multiplication()">Multiply</button>

    <p id="result"></p>

  </div>
  <script>

    function multiply(number1, number2) {

      if (number2 === undefined) {
        return "The second number is missing.";
      }

      return number1 * number2;
    }


    function checkMultiplication() {

      let number1 = document.getElementById("number1").value;
      let number2 = document.getElementById("number2").value;

      number1 = Number(number1);

      if (number2 === "") {

        let answer = multiply(number1);

        document.getElementById("result").innerHTML = answer;

      } else {

        number2 = Number(number2);

        let answer = multiply(number1, number2);

        document.getElementById("result").innerHTML =
          number1 + " × " + number2 + " = " + answer;
      }
    }

  </script>
</body>
</html>
